plugins {
    id 'dev.architectury.loom' version '1.9.436'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = 'angling-forge-1.20.1' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom {
    silentMojangMappingsLicense()
    mods {
        angling { sourceSet sourceSets.main }
    }
    accessWidenerPath = file('src/main/resources/angling.accesswidener')
    forge {
        convertAccessWideners = true
        extraAccessWideners.add('angling.accesswidener')
        mixinConfig 'angling.mixins.json'
    }
    runs {
        client { client(); runDir 'run/client' }
        server { server(); runDir 'run/server'; programArg 'nogui' }
        gameTestServer {
            environment 'gametestserver'
            forgeTemplate 'gameTestServer'
            source sourceSets.gametest
            runDir 'run/gametest'
            property 'forge.enabledGameTestNamespaces', 'angling'
            mods {
                angling {
                    sourceSet sourceSets.main
                    sourceSet sourceSets.gametest
                }
            }
        }
    }
}
repositories {
    maven { url 'https://maven.minecraftforge.net/' }
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url 'https://api.modrinth.com/maven' }
    mavenCentral()
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    modImplementation 'maven.modrinth:geckolib:4.4.9-forge'
    // Loom strips GeckoLib's nested development dependency when remapping it.
    // Players receive this library inside the normal Forge GeckoLib jar.
    implementation 'com.eliotlash.mclib:mclib:20'
    forgeRuntimeLibrary 'com.eliotlash.mclib:mclib:20'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
jar {
    from('LICENSE')
    manifest { attributes('MixinConfigs': 'angling.mixins.json') }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
