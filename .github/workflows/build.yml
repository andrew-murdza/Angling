name: Forge build and runtime tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release and runtime tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build compileGametestJava
          mkdir -p run/gametest
          printf 'eula=true\n' > run/gametest/eula.txt
          ./gradlew runGameTestServer
      - name: Audit release and confirm runtime results
        shell: bash
        run: python tools/validate_release.py --jar build/libs/angling-forge-1.20.1-1.0.1-forge.1.jar --gametest-log run/gametest/logs/latest.log --report build/reports/release-validation.json
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            build/reports/
            run/gametest/logs/
            run/gametest/crash-reports/
      - name: Upload release jar
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: angling-forge-1.20.1
          path: |
            build/libs/angling-forge-1.20.1-1.0.1-forge.1.jar
            build/libs/angling-forge-1.20.1-1.0.1-forge.1-sources.jar